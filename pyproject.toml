[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localvault"
version = "1.0.0"
description = "Offline, encrypted password manager with a graphical interface, generator and built-in authenticator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ERROR404DT" }]
keywords = ["password-manager", "vault", "encryption", "totp", "offline", "gui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41", "customtkinter>=5.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
localvault = "localvault.gui.app:main"

[tool.setuptools.packages.find]
include = ["localvault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
