<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="LocalVault: offline, encrypted password manager">
  <title>LocalVault</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B131D"/><stop offset="1" stop-color="#14263B"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#E39F26"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#F2B544" stop-opacity=".55"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .shackle{animation:lift 5s ease-in-out infinite}
    @keyframes lift{0%,18%{transform:translateY(0)}28%,52%{transform:translateY(-16px)}62%,100%{transform:translateY(0)}}
    .halo{animation:halo 5s ease-in-out infinite}
    @keyframes halo{0%,18%,62%,100%{opacity:.25}28%,52%{opacity:1}}
    .drift{opacity:0;animation:drift 9s linear infinite}
    @keyframes drift{0%{transform:translateY(40px);opacity:0}15%{opacity:.4}85%{opacity:.4}100%{transform:translateY(-70px);opacity:0}}
    .d2{animation-delay:-2s}.d3{animation-delay:-4s}.d4{animation-delay:-6s}.d5{animation-delay:-8s}
  </style>
  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <g class="mono" font-size="15">
      <text class="drift" x="660" y="230" fill="#4FD1C5">k7#Qm2$x</text>
      <text class="drift d2" x="780" y="250" fill="#F2B544">Zr9!vL0e</text>
      <text class="drift d3" x="700" y="270" fill="#4FD1C5">a8F&amp;2nQw</text>
      <text class="drift d4" x="820" y="210" fill="#F2B544">t3^Xp9@c</text>
      <text class="drift d5" x="40" y="260" fill="#4FD1C5">••••••••</text>
      <text class="drift d3" x="90" y="240" fill="#F2B544">m4$Lw8!Z</text>
    </g>
    <circle class="halo" cx="170" cy="160" r="110" fill="url(#halo)"/>
    <g>
      <g class="shackle">
        <path d="M147 152 V120 a23 23 0 0 1 46 0 V152" fill="none" stroke="url(#brass)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <rect x="120" y="150" width="100" height="78" rx="12" fill="url(#brass)"/>
      <circle cx="170" cy="182" r="9" fill="#0B131D"/>
      <rect x="166" y="187" width="8" height="20" rx="3" fill="#0B131D"/>
    </g>
    <text class="sans" x="290" y="140" font-size="66" font-weight="800" fill="#E6EDF5">LocalVault</text>
    <text class="sans" x="292" y="180" font-size="22" fill="#8FA3BA">Your passwords. Encrypted. Offline. Yours.</text>
    <g class="mono" font-size="13" fill="#E6EDF5">
      <rect x="292" y="206" width="112" height="30" rx="15" fill="#192A3E" stroke="#263B55"/><text x="348" y="226" text-anchor="middle">AES-256-GCM</text>
      <rect x="414" y="206" width="104" height="30" rx="15" fill="#192A3E" stroke="#263B55"/><text x="466" y="226" text-anchor="middle">scrypt KDF</text>
      <rect x="528" y="206" width="88" height="30" rx="15" fill="#192A3E" stroke="#263B55"/><text x="572" y="226" text-anchor="middle">no cloud</text>
      <rect x="626" y="206" width="146" height="30" rx="15" fill="#192A3E" stroke="#263B55"/><text x="699" y="226" text-anchor="middle">Windows + Linux</text>
    </g>
    <rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#263B55"/>
  </g>
</svg>
