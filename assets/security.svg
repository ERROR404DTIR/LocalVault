<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="How LocalVault encrypts your data">
  <title>How your vault is protected</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8FA3BA"/></marker>
    <path id="route" d="M20 125 H880"/>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .node{animation:pulse 6s ease-in-out infinite}
    .n2{animation-delay:1.2s}.n3{animation-delay:2.4s}.n4{animation-delay:3.6s}.n5{animation-delay:4.8s}
    @keyframes pulse{0%,16%,100%{stroke:#263B55}6%{stroke:#F2B544}}
    .nope{animation:blink 3s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect width="900" height="290" rx="18" fill="#0B131D"/>
  <rect x=".5" y=".5" width="899" height="289" rx="18" fill="none" stroke="#263B55"/>
  <text class="sans" x="40" y="44" font-size="20" font-weight="700" fill="#E6EDF5">What happens when you save a password</text>

  <g stroke="#8FA3BA" stroke-width="2" marker-end="url(#arrow)">
    <line x1="156" y1="125" x2="204" y2="125"/><line x1="336" y1="125" x2="384" y2="125"/>
    <line x1="516" y1="125" x2="564" y2="125"/><line x1="696" y1="125" x2="744" y2="125"/>
  </g>
  <g class="sans" text-anchor="middle">
    <rect class="node" x="24" y="85" width="132" height="80" rx="12" fill="#121E2D" stroke="#263B55" stroke-width="2"/>
    <text x="90" y="120" font-size="15" font-weight="700" fill="#E6EDF5">Master</text><text x="90" y="139" font-size="15" font-weight="700" fill="#E6EDF5">password</text>
    <text x="90" y="186" font-size="12" fill="#8FA3BA">only in your head</text>

    <rect class="node n2" x="204" y="85" width="132" height="80" rx="12" fill="#121E2D" stroke="#263B55" stroke-width="2"/>
    <text x="270" y="131" font-size="17" font-weight="700" fill="#E6EDF5">scrypt</text>
    <text x="270" y="186" font-size="12" fill="#8FA3BA">slow on purpose</text>

    <rect class="node n3" x="384" y="85" width="132" height="80" rx="12" fill="#121E2D" stroke="#263B55" stroke-width="2"/>
    <text x="450" y="120" font-size="15" font-weight="700" fill="#E6EDF5">256-bit</text><text x="450" y="139" font-size="15" font-weight="700" fill="#E6EDF5">key</text>
    <text x="450" y="186" font-size="12" fill="#8FA3BA">never written to disk</text>

    <rect class="node n4" x="564" y="85" width="132" height="80" rx="12" fill="#121E2D" stroke="#263B55" stroke-width="2"/>
    <text x="630" y="120" font-size="15" font-weight="700" fill="#E6EDF5">AES-256</text><text x="630" y="139" font-size="15" font-weight="700" fill="#E6EDF5">GCM</text>
    <text x="630" y="186" font-size="12" fill="#8FA3BA">encrypt + verify</text>

    <rect class="node n5" x="744" y="85" width="132" height="80" rx="12" fill="#121E2D" stroke="#263B55" stroke-width="2"/>
    <text x="810" y="131" font-size="17" font-weight="700" class="mono" fill="#F2B544">vault.lv</text>
    <text x="810" y="186" font-size="12" fill="#8FA3BA">a file on your disk</text>
  </g>
  <circle r="6" fill="#F2B544"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#route"/></animateMotion></circle>

  <g class="nope">
    <path d="M300 246 a11 11 0 0 1 3 -21 a15 15 0 0 1 29 4 a10 10 0 0 1 2 17 z" fill="none" stroke="#8FA3BA" stroke-width="2" transform="translate(-10,0)"/>
    <line x1="284" y1="214" x2="330" y2="252" stroke="#F2706B" stroke-width="3" stroke-linecap="round"/>
    <text class="sans" x="350" y="241" font-size="15" fill="#E6EDF5">No servers. No accounts. No telemetry. Your vault never leaves this machine.</text>
  </g>
</svg>
