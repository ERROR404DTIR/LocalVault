<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">LocalVault</title><desc id="d">A private vault represented by a shield and encrypted local data layers.</desc><defs><linearGradient id="bg"><stop stop-color="#17283e"/><stop offset="1" stop-color="#09111d"/></linearGradient><linearGradient id="g"><stop stop-color="#62e3c1"/><stop offset="1" stop-color="#8fa8ff"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><path d="M875 55L975 90V155C975 220 930 252 875 270C820 252 775 220 775 155V90Z" fill="#112c3a" stroke="url(#g)" stroke-width="5"/><rect x="835" y="130" width="80" height="65" rx="10" fill="#1b4550" stroke="#62e3c1" stroke-width="3"/><path d="M852 130V112A23 23 0 0 1 898 112V130" fill="none" stroke="#62e3c1" stroke-width="5"/><circle cx="875" cy="160" r="7" fill="#edf3ff"/><path d="M875 167V180" stroke="#edf3ff" stroke-width="4"/><g fill="#62e3c1" opacity=".7"><circle cx="700" cy="90" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1030" cy="205" r="5"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g><text x="80" y="135" fill="#edf3ff" font-family="Arial,sans-serif" font-size="58" font-weight="700">LOCALVAULT</text><text x="84" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="4">PRIVATE BY DESIGN. STORED LOCALLY.</text><path d="M85 215H550" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 465;465 0" dur="4s" repeatCount="indefinite"/></path></svg>